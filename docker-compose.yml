services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tavus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: tavus_interviewer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      - ./src/tavus_cvi/adapters/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
